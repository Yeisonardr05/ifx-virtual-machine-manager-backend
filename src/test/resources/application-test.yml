spring:
  r2dbc:
    url: r2dbc:h2:mem:///vm_manager_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

app:
  jwt:
    secret: test-jwt-secret-key-at-least-32-bytes-long-for-hs256
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200
  cookie:
    secure: false
    same-site: Strict
